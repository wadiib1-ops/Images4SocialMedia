name: MP4 Videos automatisch loeschen

on:
  schedule:
    - cron: '0 0 * * *' # Läuft jeden Tag um Mitternacht
  workflow_dispatch: # Erlaubt es dir, den Job jederzeit manuell zu starten

jobs:
  cleanup-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Passende MP4 Dateien suchen, loeschen und protokollieren
      run: |
        TARGET_DIR="botola-video"
        LOG_FILE="$TARGET_DIR/cleanup_history.log"
        
        # Prüfen, ob der Ordner existiert
        if [ -d "$TARGET_DIR" ]; then
          echo "Starte Bereinigung im Ordner '$TARGET_DIR'..."
          
          # Aktuelles Datum und Uhrzeit im Format DD.MM.YYYY HH:MM:SS (deutsche Zeit/Europe/Berlin) holen
          export TZ="Europe/Berlin"
          CURRENT_TIME=$(date "+%d.%m.%Y %H:%M:%S")
          
          # Temporäre Liste für gefundene Dateien erstellen
          find "$TARGET_DIR" -type f -mtime +5 \( -name "botola*.mp4" -o -name "musik*.mp4" \) > deleted_files.txt
          
          # Wenn Dateien gefunden wurden, diese protokollieren und löschen
          if [ -s deleted_files.txt ]; then
            echo "[$CURRENT_TIME] Folgende Dateien wurden gelöscht:" >> "$LOG_FILE"
            
            while IFS= read -r file; do
              # In die Log-Datei schreiben
              echo "  - $file" >> "$LOG_FILE"
              # Datei tatsächlich löschen
              rm "$file"
            done < deleted_files.txt
            
            echo "--------------------------------------------------" >> "$LOG_FILE"
            echo "Löschungen erfolgreich in $LOG_FILE protokolliert."
          else
            echo "Keine veralteten Dateien zum Löschen gefunden."
          fi
          
          # Temporäre Datei aufräumen
          rm -f deleted_files.txt
        else
          echo "Ordner '$TARGET_DIR' existiert nicht. Abbruch."
        fi

    - name: Aenderungen hochladen
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        git add .
        if ! git diff --staged --quiet; then
          git commit -m "System: MP4-Dateien automatisch aufgeräumt & Log aktualisiert"
          git push
        else
          echo "Keine Änderungen (weder Dateien gelöscht noch Log verändert)."
        fi
