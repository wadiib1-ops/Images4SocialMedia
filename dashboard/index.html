<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektfortschritt</title>
<meta name="description" content="Tägliche Fortschritte der Veröffentlichungen auf Facebook und Instagram, berechnet aus publisher/log.jsonl.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Projektfortschritt</h1>
      <div class="sub">
        <span class="live" id="live"><span class="live-dot"></span><span id="liveText">Live</span></span>
        <span>Stand: <b id="stand">lade …</b></span>
        <span id="srcInfo"></span>
      </div>
    </div>
    <div class="filters" role="toolbar" aria-label="Filter">
      <div class="seg" id="fRange" aria-label="Zeitraum">
        <button data-v="1">Heute</button>
        <button data-v="7">7 Tage</button>
        <button data-v="30">30 Tage</button>
        <button data-v="all">Alles</button>
      </div>
      <div class="seg" id="fPlat" aria-label="Plattform">
        <button data-v="">Alle</button>
        <button data-v="facebook">Facebook</button>
        <button data-v="instagram">Instagram</button>
      </div>
      <button class="icon-btn" id="btnRefresh" title="Jetzt neu laden">↻ Aktualisieren</button>
      <button class="icon-btn" id="btnTheme" title="Hell / Dunkel umschalten">☾ Dunkel</button>
    </div>
  </header>

  <div class="banner" id="banner" role="status">
    <span id="bannerText"></span>
    <button class="icon-btn" id="bannerOk">Gesehen</button>
  </div>

  <main id="app">
    <div class="state"><div class="spinner"></div>Protokoll wird geladen …</div>
  </main>
</div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<script src="app.js"></script>
</body>
</html>
